name: Native build

on:
  push:
    branches: [main, native-experimental]
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Update the native-nightly prerelease after all builds pass
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_ref:
        description: Source branch, tag or commit to build
        type: string
        default: ''
      publish:
        description: Update the native-nightly prerelease after all builds pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: windows-x86_64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Install Linux keyboard development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxtst-dev libopencv-dev
      - name: Install macOS OpenCV
        if: runner.os == 'macOS'
        run: brew install opencv
      - name: Restore and verify native development assets without Python
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        working-directory: native
        run: cmake -DNATIVE_PLATFORM="$EXPECTED_PLATFORM" -P scripts/setup_native.cmake
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S native -B native/build-ci -G "Visual Studio 17 2022" -A x64 -DNIJITRACK_KEYBOARD=ON -DBUILD_TESTING=ON
      - name: Configure Linux and macOS
        if: runner.os != 'Windows'
        run: |
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then args+=("-DOpenCV_DIR=$(brew --prefix opencv)/lib/cmake/opencv4"); fi
          cmake -S native -B native/build-ci -DCMAKE_BUILD_TYPE=Release -DNIJITRACK_KEYBOARD=ON -DBUILD_TESTING=ON "${args[@]}"
      - name: Build tracker and native keyboard backend
        run: cmake --build native/build-ci --config Release --parallel 2
      - name: Test startup, CLI validation and child process handling
        run: ctest --test-dir native/build-ci -C Release --output-on-failure
      - name: Package executable, SDK libraries and licenses
        run: cmake --install native/build-ci --config Release --prefix "$GITHUB_WORKSPACE/native/install"
      - name: Test packaged executable startup
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            native/install/bin/nijitrack.exe -h
            native/install/bin/nijitrack-cpp.exe --help
          else
            native/install/bin/nijitrack -h
            native/install/bin/nijitrack-cpp --help
          fi
      - name: Archive package preserving Unix executable permissions
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p native/dist
          cd native/install
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -E tar cf "../dist/nijitrack-native-${NATIVE_PLATFORM}.zip" --format=zip .
          else
            cmake -E tar czf "../dist/nijitrack-native-${NATIVE_PLATFORM}.tar.gz" --format=gnutar .
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nijitrack-native-${{ matrix.platform }}
          path: native/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Update native nightly prerelease
    needs: [source, build]
    if: inputs.publish && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: native-nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nijitrack-native-*
          merge-multiple: true
          path: dist
      - name: Check packages and generate checksums
        shell: bash
        run: |
          expected=(nijitrack-native-linux-x86_64.tar.gz nijitrack-native-macos-arm64.tar.gz nijitrack-native-windows-x86_64.zip)
          for package in "${expected[@]}"; do test -s "dist/$package"; done
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          cd dist
          sha256sum "${expected[@]}" > SHA256SUMS
      - name: Publish or update rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          tag=native-nightly
          cat > notes.md <<EOF_NOTES
          Experimental C++ nijitrack nightly / 仮リリース

          Source: ${SOURCE_SHA} (native-experimental)
          Build: https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}

          - Windows x86-64 / macOS arm64 / Linux x86-64
          - Includes executable, MediaPipe shared libraries and licenses.
          - No model, face image, video or captured data is included.
          - Reuse your existing face_landmarker_v2_with_blendshapes.task with --model.
          - Camera/video capture and preview use OpenCV; no external FFmpeg executable is needed.
          - Linux requires glibc 2.39+, OpenCV, libX11 and libXtst; macOS requires OpenCV; Windows requires the MSVC runtime.
          - Camera permissions, global keyboard permissions and real-face tracking are not tested by CI.

          This rolling prerelease is updated after all three platform builds and startup tests pass.
          EOF_NOTES
          if ! gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --silent; then
            gh api "repos/${GH_REPO}/git/refs" -X POST -f ref="refs/tags/${tag}" -f sha="$SOURCE_SHA" --silent
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --prerelease --title "Native nightly (experimental)" --notes-file notes.md
          fi
          gh release upload "$tag" dist/* --clobber
          gh api "repos/${GH_REPO}/git/refs/tags/${tag}" -X PATCH -f sha="$SOURCE_SHA" -F force=true --silent
          gh release edit "$tag" --draft=false --prerelease --latest=false --title "Native nightly (experimental)" --notes-file notes.md
