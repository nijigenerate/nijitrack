name: Native build

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Update the native-nightly prerelease after all builds pass
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_ref:
        description: Source branch, tag or commit to build
        type: string
        default: ''
      publish:
        description: Update the native-nightly prerelease after all builds pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: windows-x86_64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux keyboard development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxtst-dev
      - name: Check runner architecture and download pinned SDK
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        working-directory: native
        run: |
          python -c 'import os, sys; sys.path.insert(0, "scripts"); from fetch_assets import host_platform; assert host_platform() == os.environ["EXPECTED_PLATFORM"], host_platform()'
          python scripts/fetch_assets.py
          python scripts/verify_assets.py
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S native -B native/build-ci -G "Visual Studio 17 2022" -A x64 -DNIJITRACK_KEYBOARD=ON -DBUILD_TESTING=ON
      - name: Configure Linux and macOS
        if: runner.os != 'Windows'
        run: cmake -S native -B native/build-ci -DCMAKE_BUILD_TYPE=Release -DNIJITRACK_KEYBOARD=ON -DBUILD_TESTING=ON
      - name: Build tracker and native keyboard backend
        run: cmake --build native/build-ci --config Release --parallel 2
      - name: Test startup, CLI validation and child process handling
        run: ctest --test-dir native/build-ci -C Release --output-on-failure
      - name: Package executable, SDK libraries and licenses
        run: cmake --install native/build-ci --config Release --prefix "$GITHUB_WORKSPACE/native/install"
      - name: Test packaged executable startup
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            native/install/bin/nijitrack-cpp.exe --help
          else
            native/install/bin/nijitrack-cpp --help
          fi
      - name: Archive package preserving Unix executable permissions
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import shutil
          destination = Path("native/dist")
          destination.mkdir(parents=True, exist_ok=True)
          kind = "zip" if os.name == "nt" else "gztar"
          shutil.make_archive(str(destination / ("nijitrack-native-" + os.environ["NATIVE_PLATFORM"])), kind, root_dir="native/install")
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nijitrack-native-${{ matrix.platform }}
          path: native/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Update native nightly prerelease
    needs: [source, build]
    if: inputs.publish && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: native-nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nijitrack-native-*
          merge-multiple: true
          path: dist
      - name: Check packages and generate checksums
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          root = Path('dist')
          expected = {
              'nijitrack-native-linux-x86_64.tar.gz',
              'nijitrack-native-macos-arm64.tar.gz',
              'nijitrack-native-windows-x86_64.zip',
          }
          assert {p.name for p in root.iterdir()} == expected, 'Missing or unexpected packages'
          lines = []
          for name in sorted(expected):
              data = (root / name).read_bytes()
              assert data, name
              lines.append(hashlib.sha256(data).hexdigest() + '  ' + name)
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          PYTHON
      - name: Publish or update rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          tag=native-nightly
          cat > notes.md <<EOF_NOTES
          Experimental C++ nijitrack nightly / 仮リリース

          Source: ${SOURCE_SHA} (main)
          Build: https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}

          - Windows x86-64 / macOS arm64 / Linux x86-64
          - Includes executable, MediaPipe shared libraries and licenses.
          - No model, face image, video or captured data is included.
          - Reuse your existing face_landmarker_v2_with_blendshapes.task with --model.
          - FFmpeg must be installed separately for camera/video input.
          - Linux requires glibc 2.39+, libX11 and libXtst; Windows requires the MSVC runtime.
          - Camera permissions, global keyboard permissions and real-face tracking are not tested by CI.

          This rolling prerelease is updated after all three platform builds and startup tests pass.
          EOF_NOTES
          if ! gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --silent; then
            gh api "repos/${GH_REPO}/git/refs" -X POST -f ref="refs/tags/${tag}" -f sha="$SOURCE_SHA" --silent
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --prerelease --title "Native nightly (experimental)" --notes-file notes.md
          fi
          gh release upload "$tag" dist/* --clobber
          gh api "repos/${GH_REPO}/git/refs/tags/${tag}" -X PATCH -f sha="$SOURCE_SHA" -F force=true --silent
          gh release edit "$tag" --draft=false --prerelease --latest=false --title "Native nightly (experimental)" --notes-file notes.md
