name: Native build

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
      - '.github/workflows/native-nightly.yml'
      - '.github/scripts/native-cache-transfer.cmake'
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
      - '.github/workflows/native-nightly.yml'
      - '.github/scripts/native-cache-transfer.cmake'
  workflow_dispatch:
    inputs:
      publish:
        description: Update the native-nightly prerelease after all builds pass
        type: boolean
        default: false
      export_cache:
        description: Export existing native-experimental caches for main migration
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_ref:
        description: Source branch, tag or commit to build
        type: string
        default: ''
      publish:
        description: Update the native-nightly prerelease after all builds pass
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.publish && 'refs/heads/main' || inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: windows-x86_64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Install Linux media and keyboard development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build binutils jq curl pkg-config libegl-dev libgles-dev libx11-dev libxtst-dev libasound2-dev libpulse-dev libudev-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libwayland-dev libxkbcommon-dev
      - name: Install macOS media dependencies
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config jq
      - name: Identify hosted compiler and SDK image
        id: toolchain
        run: |
          mkdir -p native/results/build-environment
          # ImageVersion changes when hosted compilers or system SDKs change.
          # Pinned downloaded compilers are also covered by the lockfile keys.
          printf '%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:?}" "${ImageVersion:?}" > native/results/build-environment/ci-toolchain.txt
          cmake --version >> native/results/build-environment/ci-toolchain.txt
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            clang --version >> native/results/build-environment/ci-toolchain.txt
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            xcodebuild -version >> native/results/build-environment/ci-toolchain.txt
            xcrun --show-sdk-version >> native/results/build-environment/ci-toolchain.txt
          fi
          fingerprint=$(cmake -E sha256sum native/results/build-environment/ci-toolchain.txt)
          echo "fingerprint=${fingerprint%% *}" >> "$GITHUB_OUTPUT"
      - name: Compute cache keys
        id: cache-keys
        env:
          TOOLS_KEY: native-tools-v1-${{ matrix.platform }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('native/toolchain*.lock.json', 'native/scripts/setup_tracking*', 'native/scripts/setup_native_toolchain.ps1') }}
          SDK_KEY: native-sdk-v1-${{ matrix.platform }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('native/toolchain*.lock.json', 'native/assets.lock.json', 'native/patches/**', 'native/toolchain/**', 'native/scripts/*.sh', 'native/scripts/*.ps1', 'native/build.sh') }}
        run: |
          echo "tools=$TOOLS_KEY" >> "$GITHUB_OUTPUT"
          echo "sdk=$SDK_KEY" >> "$GITHUB_OUTPUT"
      - name: Restore verified tools and downloads
        id: tools-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/vendor/toolchain
            native/vendor/downloads
            native/vendor/sources
            native/build-sdl3
          key: ${{ steps.cache-keys.outputs.tools }}
      - name: Restore static tracking SDK
        id: sdk-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: native/vendor/sdk-halide
          # Exact keys only: never fall back to an SDK built from another recipe.
          key: ${{ steps.cache-keys.outputs.sdk }}
      - name: Validate native-experimental cache transfer source
        id: cache-seed
        if: vars.NATIVE_CACHE_SEED_RUN_ID != '' && (steps.tools-cache.outputs.cache-hit != 'true' || steps.sdk-cache.outputs.cache-hit != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_RUN: ${{ vars.NATIVE_CACHE_SEED_RUN_ID }}
          SEED_ARTIFACT: native-cache-seed-${{ matrix.platform }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SEED_RUN" --jq 'select(.head_branch == "native-experimental" and .conclusion == "success" and .path == ".github/workflows/native-build.yml") | .id' > "$RUNNER_TEMP/cache-seed-run.txt"
          test "$(cat "$RUNNER_TEMP/cache-seed-run.txt")" = "$SEED_RUN"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SEED_RUN/artifacts" --jq '.artifacts[] | select(.expired == false) | .name' > "$RUNNER_TEMP/cache-seed-artifacts.txt"
          available=false
          while IFS= read -r name; do
            if [[ "$name" == "$SEED_ARTIFACT" ]]; then available=true; fi
          done < "$RUNNER_TEMP/cache-seed-artifacts.txt"
          echo "available=$available" >> "$GITHUB_OUTPUT"
      - name: Download existing branch caches
        id: cache-download
        if: steps.cache-seed.outputs.available == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-cache-seed-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-cache-seed
          github-token: ${{ github.token }}
          run-id: ${{ vars.NATIVE_CACHE_SEED_RUN_ID }}
      - name: Import existing caches without rebuilding
        id: cache-import
        if: steps.cache-download.conclusion == 'success'
        env:
          NATIVE_CACHE_SEED_DIR: ${{ runner.temp }}/native-cache-seed
          NATIVE_TOOLS_KEY: ${{ steps.cache-keys.outputs.tools }}
          NATIVE_SDK_KEY: ${{ steps.cache-keys.outputs.sdk }}
          NATIVE_TOOLS_HIT: ${{ steps.tools-cache.outputs.cache-hit }}
          NATIVE_SDK_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
        run: cmake -DMODE=import -P .github/scripts/native-cache-transfer.cmake
      - name: Verify checked-in native headers and data
        run: cmake -P native/scripts/setup_native.cmake
      - name: Check shell script syntax
        run: |
          bash -n native/build.sh
          for script in native/scripts/*.sh native/tests/*.sh; do bash -n "$script"; done
      - name: Prepare Linux and macOS build tools
        if: runner.os != 'Windows'
        run: bash native/build.sh setup
      - name: Prepare Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& native/scripts/setup_native_toolchain.ps1'
      - name: Save verified tools and downloads
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/vendor/toolchain
            native/vendor/downloads
            native/vendor/sources
            native/build-sdl3
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Prepare Linux and macOS patched sources
        if: runner.os != 'Windows'
        run: bash native/build.sh prepare
      - name: Prepare Windows patched sources
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& native/scripts/prepare_mediapipe_halide.ps1'
      - name: Build Linux and macOS static SDK
        id: sdk-unix
        if: runner.os != 'Windows' && steps.sdk-cache.outputs.cache-hit != 'true' && steps.cache-import.outputs.sdk != 'true'
        run: bash native/build.sh sdk
      - name: Build Windows static SDK
        id: sdk-windows
        if: runner.os == 'Windows' && steps.sdk-cache.outputs.cache-hit != 'true' && steps.cache-import.outputs.sdk != 'true'
        shell: pwsh
        run: |
          & native/scripts/build_mediapipe_halide.ps1
          & native/tests/patch_management.ps1 -Dependencies
      - name: Save completed static tracking SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true' && (steps.sdk-unix.conclusion == 'success' || steps.sdk-windows.conclusion == 'success' || steps.cache-import.outputs.sdk == 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: native/vendor/sdk-halide
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Stage legacy filename to verify install cleanup
        run: |
          mkdir -p native/install/bin
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -E touch native/install/bin/nijitrack-cpp.exe
          else
            cmake -E touch native/install/bin/nijitrack-cpp
          fi
      - name: Build, test and audit Linux and macOS tracker
        if: runner.os != 'Windows'
        run: bash native/build.sh install
      - name: Build, test and audit Windows tracker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & native/scripts/build_native.ps1 -Install
          ctest --test-dir native/build-mediapipe/halide --output-on-failure
      - name: Test face and hand inference with verified official fixtures
        run: bash native/tests/run_tracking_smoke.sh
      - name: Test packaged executable startup
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            native/install/bin/nijitrack.exe -h
            native/install/bin/nijitrack.exe --help
            test ! -e native/install/bin/nijitrack-cpp.exe
          else
            native/install/bin/nijitrack -h
            native/install/bin/nijitrack --help
            test ! -e native/install/bin/nijitrack-cpp
          fi
      - name: Export existing caches for main migration
        id: cache-export
        if: github.ref == 'refs/heads/native-experimental' && (inputs.export_cache || vars.NATIVE_CACHE_SEED_RUN_ID == '')
        env:
          NATIVE_CACHE_SEED_DIR: ${{ runner.temp }}/native-cache-seed
          NATIVE_TOOLS_KEY: ${{ steps.cache-keys.outputs.tools }}
          NATIVE_SDK_KEY: ${{ steps.cache-keys.outputs.sdk }}
        run: cmake -DMODE=export -P .github/scripts/native-cache-transfer.cmake
      - name: Upload caches for cross-branch reuse
        if: steps.cache-export.conclusion == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-cache-seed-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-cache-seed/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Archive package preserving Unix executable permissions
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p native/dist
          cd native/install
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            archive="../dist/nijitrack-native-${NATIVE_PLATFORM}.zip"
            cmake -E tar cf "$archive" --format=zip .
            expected=bin/nijitrack.exe
          else
            archive="../dist/nijitrack-native-${NATIVE_PLATFORM}.tar.gz"
            cmake -E tar czf "$archive" --format=gnutar .
            expected=bin/nijitrack
          fi
          cmake -E tar tf "$archive" > ../results/build-environment/package-contents.txt
          count=0
          while IFS= read -r entry; do
            entry=${entry%$'\r'}
            entry=${entry#./}
            if [[ "$entry" == "$expected" ]]; then count=$((count+1)); fi
            if [[ "$entry" == bin/nijitrack-cpp || "$entry" == bin/nijitrack-cpp.exe ]]; then
              echo "Duplicate tracker in package: $entry" >&2
              exit 1
            fi
          done < ../results/build-environment/package-contents.txt
          test "$count" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nijitrack-native-${{ matrix.platform }}
          path: native/dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            native/results/build-environment/*.txt
            native/results/build-environment/*.json
            native/build-sdl-static/Testing/Temporary/LastTest.log
            native/build-mediapipe/halide/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Report cache usage
        if: always()
        run: |
          {
            echo '### Native build cache'
            echo 'Tools cache hit: ${{ steps.tools-cache.outputs.cache-hit }}'
            echo 'Static SDK cache hit: ${{ steps.sdk-cache.outputs.cache-hit }}'
            echo 'Transferred tools: ${{ steps.cache-import.outputs.tools }}'
            echo 'Transferred SDK: ${{ steps.cache-import.outputs.sdk }}'
            echo 'Tracker build, tests, inference and dependency audits run on every build.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Update native nightly prerelease
    needs: [source, build]
    if: inputs.publish && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: native-nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nijitrack-native-*
          merge-multiple: true
          path: dist
      - name: Check packages and generate checksums
        shell: bash
        run: |
          expected=(nijitrack-native-linux-x86_64.tar.gz nijitrack-native-macos-arm64.tar.gz nijitrack-native-windows-x86_64.zip)
          for package in "${expected[@]}"; do test -s "dist/$package"; done
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          cd dist
          sha256sum "${expected[@]}" > SHA256SUMS
      - name: Publish or update rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          tag=native-nightly
          cat > notes.md <<EOF_NOTES
          Experimental C++ nijitrack nightly / 仮リリース

          Source: ${SOURCE_SHA} (main)
          Build: https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}

          - Windows x86-64 / macOS arm64 / Linux x86-64
          - Includes executable with statically linked face/hand MediaPipe, SDL3 and licenses.
          - No model, face image, video or captured data is included.
          - Reuse your existing face_landmarker_v2_with_blendshapes.task with --model.
          - Camera capture and preview use SDL3; video file input is not supported.
          - Linux requires libX11 and libXtst; Windows statically links the MSVC runtime.
          - Camera permissions, global keyboard permissions and live camera tracking are not tested by CI.

          This rolling prerelease is updated after all three platform builds and startup tests pass.
          EOF_NOTES
          if ! gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --silent; then
            gh api "repos/${GH_REPO}/git/refs" -X POST -f ref="refs/tags/${tag}" -f sha="$SOURCE_SHA" --silent
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --prerelease --title "Native nightly (experimental)" --notes-file notes.md
          fi
          gh release upload "$tag" dist/* --clobber
          gh api "repos/${GH_REPO}/git/refs/tags/${tag}" -X PATCH -f sha="$SOURCE_SHA" -F force=true --silent
          gh release edit "$tag" --draft=false --prerelease --latest=false --title "Native nightly (experimental)" --notes-file notes.md
